# Security scanning — see issue #60.
#
# Three jobs: CodeQL (SAST for python + js/ts), pip-audit (CVE alerts on
# Python deps resolved from uv.lock), and npm audit (CVE alerts on the
# frontend panel and the root E2E runner).
#
# Severity thresholds:
#  - pip-audit: defaults (fails on any finding) plus an explicit ignore
#    list for CVEs in HA-pinned transitive deps tracked by #79.
#  - npm audit: --audit-level=high on both jobs.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Export locked dependencies
        # Materialize uv.lock as a flat requirements list so pip-audit can
        # consume it. `--no-emit-project` excludes the abode-security
        # package itself (no upstream CVEs to check against). `--all-extras`
        # is load-bearing: this project's runtime requirements live entirely
        # in [project.optional-dependencies].dev (the runtime list in
        # pyproject.toml is empty), so without it the export would be empty
        # and pip-audit would silently scan zero packages.
        run: uv export --no-hashes --no-emit-project --all-extras --format requirements-txt -o /tmp/requirements-locked.txt

      - name: Run pip-audit
        # `--ignore-vuln` entries are HA-pinned transitive CVEs. Removed
        # individually when `pytest-homeassistant-custom-component` bumps
        # to a release whose lockstep resolves the dep. Triage tracked
        # in #79.
        #   CVE-2026-4539        — earlier HA-pinned transitive dep
        #   GHSA-4gg8-gxpx-9rph  — uv 0.11.8 (HA pins; fix 0.11.15)
        #   CVE-2026-47180       — zeroconf 0.148.0 (HA pins; fix 0.149.5)
        #   CVE-2026-47183       — zeroconf 0.148.0 (HA pins; fix 0.149.6)
        #   CVE-2026-47184       — zeroconf 0.148.0 (HA pins; fix 0.149.7)
        #   CVE-2026-48045       — zeroconf 0.148.0 (HA pins; fix 0.149.12)
        #   CVE-2026-34993       — aiohttp 3.13.5 (HA pins; fix 3.14.0)
        #   CVE-2026-47265       — aiohttp 3.13.5 (HA pins; fix 3.14.0)
        #   PYSEC-2026-175/177/178/179 — pyjwt 2.12.1 (HA pins; fix 2.13.0)
        run: |
          uvx pip-audit --requirement /tmp/requirements-locked.txt --strict \
            --ignore-vuln CVE-2026-4539 \
            --ignore-vuln GHSA-4gg8-gxpx-9rph \
            --ignore-vuln CVE-2026-47180 \
            --ignore-vuln CVE-2026-47183 \
            --ignore-vuln CVE-2026-47184 \
            --ignore-vuln CVE-2026-48045 \
            --ignore-vuln CVE-2026-34993 \
            --ignore-vuln CVE-2026-47265 \
            --ignore-vuln PYSEC-2026-175 \
            --ignore-vuln PYSEC-2026-177 \
            --ignore-vuln PYSEC-2026-178 \
            --ignore-vuln PYSEC-2026-179

  npm-audit-frontend:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: "frontend/.nvmrc"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Audit
        run: npm audit --audit-level=high

  npm-audit-root:
    name: npm audit (root / E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: "frontend/.nvmrc"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Audit
        run: npm audit --audit-level=high
