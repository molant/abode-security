# Security scanning — see issue #60.
#
# Three jobs: CodeQL (SAST for python + js/ts), pip-audit (CVE alerts on
# Python deps resolved from uv.lock), and npm audit (CVE alerts on the
# frontend panel and the root E2E runner).
#
# Severity thresholds:
#  - pip-audit: defaults (fails on any finding) plus an explicit ignore
#    list for CVEs in HA-pinned transitive deps tracked by #79.
#  - npm audit: --audit-level=high on both jobs; the frontend job filters
#    out allowlisted GHSAs (see its Audit step).
#
# Not covered: tests/mock_server/uv.lock. pip-audit reads the root uv.lock
# only, and the mock server's python-socketio/python-engineio are held on
# Engine.IO v3 majors on purpose (#105), so they would be permanent ignores
# anyway. Test-only and container-scoped.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Export locked dependencies
        # Materialize uv.lock as a flat requirements list so pip-audit can
        # consume it. `--no-emit-project` excludes the abode-security
        # package itself (no upstream CVEs to check against). `--all-extras`
        # is load-bearing: this project's runtime requirements live entirely
        # in [project.optional-dependencies].dev (the runtime list in
        # pyproject.toml is empty), so without it the export would be empty
        # and pip-audit would silently scan zero packages.
        run: uv export --no-hashes --no-emit-project --all-extras --format requirements-txt -o /tmp/requirements-locked.txt

      - name: Run pip-audit
        # `--ignore-vuln` entries are HA-pinned transitive CVEs. Removed
        # individually when `pytest-homeassistant-custom-component` bumps
        # to a release whose lockstep resolves the dep. Triage tracked
        # in #79.
        #
        # Current entries:
        #   PYSEC-2026-3552 — cryptography 48.0.1 (HA pins; fix 50.0.0)
        #   PYSEC-2026-3553 — cryptography 48.0.1 (HA pins; fix 49.0.0)
        #   PYSEC-2026-3554 — cryptography 48.0.1 (HA pins; fix 49.0.0)
        #   CVE-2026-102274 — pyjwt 2.13.0 (HA pins; fix 2.14.0)
        #   CVE-2026-102275 — pyjwt 2.13.0 (HA pins; fix 2.15.0)
        #   PYSEC-2026-4140..4151 — pyjwt 2.13.0 (HA pins; fix 2.14.0, 4141 needs 2.15.0)
        #   GHSA-pxh4-856f-4h89 — pyjwt 2.13.0 (HA pins; fix 2.14.0)
        #   CVE-2026-111063..111066, CVE-2026-111748..111750, GHSA-2g87-pp6c-29x5
        #     — aiohttp 3.14.3 (HA pins; fix 3.14.4, HA 2026.10.0)
        #   CVE-2026-112390..112406, CVE-2026-112891..112900, CVE-2026-96638,
        #   CVE-2026-96640, CVE-2026-96778, GHSA-78g4-xqwv-q3g8,
        #   PYSEC-2026-4326..4343 — pillow 12.3.0 (HA pins; fix 13.0.0, HA 2026.11.0)
        #   PYSEC-2026-4321 — uv 0.12.5 (HA pins; fix 0.13.4, HA 2026.10.3)
        #
        # `--python 3.14` is load-bearing: pip-audit resolves the requirement
        # set in a throwaway venv, and on a default (older) interpreter that
        # resolution fails outright — several HA deps require >=3.13 — so the
        # job would error before scanning anything.
        run: |
          uvx --python 3.14 pip-audit --requirement /tmp/requirements-locked.txt --strict \
            --ignore-vuln PYSEC-2026-3552 \
            --ignore-vuln PYSEC-2026-3553 \
            --ignore-vuln PYSEC-2026-3554 \
            --ignore-vuln CVE-2026-102274 \
            --ignore-vuln CVE-2026-102275 \
            --ignore-vuln PYSEC-2026-4140 \
            --ignore-vuln PYSEC-2026-4141 \
            --ignore-vuln PYSEC-2026-4142 \
            --ignore-vuln PYSEC-2026-4143 \
            --ignore-vuln PYSEC-2026-4144 \
            --ignore-vuln PYSEC-2026-4145 \
            --ignore-vuln PYSEC-2026-4146 \
            --ignore-vuln PYSEC-2026-4147 \
            --ignore-vuln PYSEC-2026-4148 \
            --ignore-vuln PYSEC-2026-4149 \
            --ignore-vuln PYSEC-2026-4150 \
            --ignore-vuln PYSEC-2026-4151 \
            --ignore-vuln GHSA-pxh4-856f-4h89 \
            --ignore-vuln CVE-2026-111063 \
            --ignore-vuln CVE-2026-111064 \
            --ignore-vuln CVE-2026-111065 \
            --ignore-vuln CVE-2026-111066 \
            --ignore-vuln CVE-2026-111748 \
            --ignore-vuln CVE-2026-111749 \
            --ignore-vuln CVE-2026-111750 \
            --ignore-vuln GHSA-2g87-pp6c-29x5 \
            --ignore-vuln CVE-2026-112390 \
            --ignore-vuln CVE-2026-112391 \
            --ignore-vuln CVE-2026-112393 \
            --ignore-vuln CVE-2026-112395 \
            --ignore-vuln CVE-2026-112399 \
            --ignore-vuln CVE-2026-112400 \
            --ignore-vuln CVE-2026-112401 \
            --ignore-vuln CVE-2026-112404 \
            --ignore-vuln CVE-2026-112406 \
            --ignore-vuln CVE-2026-112891 \
            --ignore-vuln CVE-2026-112892 \
            --ignore-vuln CVE-2026-112893 \
            --ignore-vuln CVE-2026-112894 \
            --ignore-vuln CVE-2026-112895 \
            --ignore-vuln CVE-2026-112897 \
            --ignore-vuln CVE-2026-112899 \
            --ignore-vuln CVE-2026-112900 \
            --ignore-vuln CVE-2026-96638 \
            --ignore-vuln CVE-2026-96640 \
            --ignore-vuln CVE-2026-96778 \
            --ignore-vuln GHSA-78g4-xqwv-q3g8 \
            --ignore-vuln PYSEC-2026-4326 \
            --ignore-vuln PYSEC-2026-4327 \
            --ignore-vuln PYSEC-2026-4328 \
            --ignore-vuln PYSEC-2026-4329 \
            --ignore-vuln PYSEC-2026-4330 \
            --ignore-vuln PYSEC-2026-4331 \
            --ignore-vuln PYSEC-2026-4332 \
            --ignore-vuln PYSEC-2026-4333 \
            --ignore-vuln PYSEC-2026-4334 \
            --ignore-vuln PYSEC-2026-4335 \
            --ignore-vuln PYSEC-2026-4336 \
            --ignore-vuln PYSEC-2026-4337 \
            --ignore-vuln PYSEC-2026-4338 \
            --ignore-vuln PYSEC-2026-4339 \
            --ignore-vuln PYSEC-2026-4340 \
            --ignore-vuln PYSEC-2026-4341 \
            --ignore-vuln PYSEC-2026-4342 \
            --ignore-vuln PYSEC-2026-4343 \
            --ignore-vuln PYSEC-2026-4321

  npm-audit-frontend:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: "frontend/.nvmrc"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Audit
        # Same as `npm audit --audit-level=high`, minus allowlisted advisories.
        # Current entries:
        #   GHSA-vfj7-8cjw-p6xm — braces <=3.0.3, no fixed release; dev-only
        #     via @web/test-runner. Remove once braces ships a fix.
        # Fails closed: empty output or an npm error response (no
        # `.vulnerabilities` object) makes jq error out.
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          remaining=$(jq -n -r --argjson ignore '["GHSA-vfj7-8cjw-p6xm"]' '
            input | if (.vulnerabilities | type) != "object" then error("unexpected npm audit output") else . end
            | [.vulnerabilities[].via[] | objects
             | select(.severity == "high" or .severity == "critical")
             | select(.url | split("/") | last | IN($ignore[]) | not)
             | "\(.severity) \(.name): \(.title) \(.url)"]
            | unique | .[]' /tmp/npm-audit.json)
          if [ -n "$remaining" ]; then
            echo "$remaining"
            exit 1
          fi

  npm-audit-root:
    name: npm audit (root / E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: "frontend/.nvmrc"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Audit
        run: npm audit --audit-level=high
