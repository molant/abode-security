# Security scanning — see issue #60.
#
# Three jobs: CodeQL (SAST for python + js/ts), pip-audit (CVE alerts on
# Python deps resolved from uv.lock), and npm-audit (CVE alerts on the
# frontend panel and the root E2E runner).
#
# Severity tuning: defaults applied for the first run. Once the baseline
# is triaged, consider `--severity=high` on pip-audit / `--audit-level=high`
# on npm audit to fail PRs only on HIGH+ findings while letting MEDIUM
# items surface in scheduled-run logs.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Export locked dependencies
        # Materialize uv.lock as a flat requirements list so pip-audit can
        # consume it. `--no-emit-project` excludes the abode-security
        # package itself (no upstream CVEs to check against). `--all-extras`
        # is load-bearing: this project's runtime requirements live entirely
        # in [project.optional-dependencies].dev (the runtime list in
        # pyproject.toml is empty), so without it the export would be empty
        # and pip-audit would silently scan zero packages.
        run: uv export --no-hashes --no-emit-project --all-extras --format requirements-txt -o /tmp/requirements-locked.txt

      - name: Run pip-audit
        run: uvx pip-audit --requirement /tmp/requirements-locked.txt --strict

  npm-audit-frontend:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: "frontend/.nvmrc"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Audit
        run: npm audit --audit-level=high

  npm-audit-root:
    name: npm audit (root / E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: "frontend/.nvmrc"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Audit
        run: npm audit --audit-level=high
