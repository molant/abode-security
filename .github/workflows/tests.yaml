name: Run Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: |
          python -m ruff check custom_components/abode_security tests
          python -m ruff format --check custom_components/abode_security tests

      - name: Type check with mypy
        run: |
          python -m mypy custom_components/abode_security --ignore-missing-imports

      - name: Run tests with pytest
        run: |
          python -m pytest tests/ -v --tb=short

  frontend-build:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'frontend/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -f "../custom_components/abode_security/www/abode-security-panel.js" ]; then
            echo "Build output not found!"
            exit 1
          fi
          echo "Frontend build successful"
          ls -lh ../custom_components/abode_security/www/
