name: Run Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        # pyproject.toml [project.optional-dependencies].dev is the single
        # source of truth for dev/CI deps (replaces the prior
        # requirements-dev.txt). `uv sync --extra dev` installs everything
        # against uv.lock, including provisioning the Python interpreter
        # declared by `requires-python` — no separate setup-python step
        # needed.
        run: uv sync --extra dev

      - name: Lint with ruff
        run: |
          uv run ruff check custom_components/abode_security tests
          uv run ruff format --check custom_components/abode_security tests

      - name: Type check with mypy
        run: uv run mypy custom_components/abode_security --ignore-missing-imports

      - name: Type check with pyright
        run: uv run pyright custom_components/abode_security

      - name: Run tests with pytest
        run: uv run pytest tests/ -v --tb=short

  frontend-build:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'frontend/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format

      - name: Type check
        run: npm run typecheck

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -f "../custom_components/abode_security/www/abode-security-panel.js" ]; then
            echo "Build output not found!"
            exit 1
          fi
          echo "Frontend build successful"
          ls -lh ../custom_components/abode_security/www/
