services:
  homeassistant:
    container_name: abode-dev-ha
    image: homeassistant/home-assistant:stable
    volumes:
      - ./config:/config
      - ./custom_components/abode_security:/config/custom_components/abode_security
    environment:
      - TZ=America/New_York
      - ABODE_API_URL=http://mock-abode:8000
    ports:
      - "8123:8123"
    restart: unless-stopped
    depends_on:
      - mock-abode
    networks:
      - abode-dev

  mock-abode:
    container_name: abode-dev-mock
    build: ./tests/mock_server
    volumes:
      - ./tests/fixtures:/app/fixtures:ro
    ports:
      - "8000:8000"
    networks:
      - abode-dev

networks:
  abode-dev:
    driver: bridge
