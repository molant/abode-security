[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abode-security"
version = "0.1.0"
description = "Custom Home Assistant integration for Abode Security Systems"
readme = "README.md"
# Constrained by pytest-homeassistant-custom-component==0.13.357, which pins
# homeassistant==2026.8.3 (requires Python 3.14.2+). Bump in lock-step with
# the pinned HA version. The HA *runtime* version target is governed by
# `minimum_home_assistant_version` in manifest.json, not this field.
requires-python = ">=3.14.2"
license = {text = "MIT"}
authors = [
    {name = "molant"},
]
dependencies = [
    # Using local async refactor of jaraco.abode from custom_components/abode_security/abode/
]

[project.optional-dependencies]
# Single source of truth for dev/CI dependencies. Synced via
# `uv sync --extra dev` (locally and in CI). Replaces the prior
# requirements-dev.txt; pyproject.toml + uv.lock is authoritative now.
dev = [
    # Type checking
    "mypy==2.3.1",
    "types-requests==2.33.0.20260712",
    # Pyright complements mypy by catching cached_property / variable-override
    # compatibility issues against HA's entity base classes (issue #70). Pinned
    # to match the locally-validated version; bump deliberately with the next
    # pyright release.
    "pyright==1.1.411",

    # Testing
    # pytest, pytest-cov, pytest-asyncio and pytest-aiohttp are pinned exactly
    # by pytest-homeassistant-custom-component — match its pins rather than
    # PyPI's latest, or uv resolution conflicts.
    "pytest==9.0.3",
    # pytest-homeassistant-custom-component pins homeassistant exactly (and
    # therefore all of HA's transitive deps: aiohttp, aiodns, pycares, etc.).
    # Keep this current with the latest HA to avoid transitive-version drift.
    "pytest-homeassistant-custom-component==0.13.358",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.4.0",
    "pytest-aiohttp==1.1.1",
    "aioresponses==0.7.9",

    # Code quality
    "ruff==0.16.4",

    # Mock server dependencies (for running locally outside Docker)
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",

    # Used directly by config_flow.py, conftest.py, and the mock server.
    # Lower-bound only: homeassistant pins requests to a specific patch version
    # via pytest-homeassistant-custom-component, and that patch changes across
    # HA releases.
    "requests>=2.32.3",

    # Abode library dependencies (vendored client at custom_components/abode_security/abode)
    "importlib_resources>=5.0",
    "six>=1.16.0",
    "platformdirs>=4.0.0",

    # Home Assistant camera component dependencies. Not imported directly;
    # installed so the HA `camera`/`stream` integrations can be imported
    # during tests. Pin matches HA's own constraint to avoid dev/prod drift.
    "PyTurboJPEG==1.8.3",

    # Imported directly by tests/test_brand_assets.py to validate brand image
    # content. Available transitively via homeassistant, but declared here so
    # the test dependency is explicit. Pin matches HA's own constraint to avoid
    # dev/prod drift.
    "pillow==12.3.0",

    # Imported directly by the aioresponses shim and its test
    # (tests/aioresponses_compat.py, tests/test_aioresponses_compat.py) to
    # compare the installed aioresponses against the release it was written
    # for. Floor is 22.0, the release that dropped LegacyVersion so that
    # Version() is strictly PEP 440-or-InvalidVersion — which is the behaviour
    # the shim's error handling relies on.
    # Available transitively via aioresponses (and homeassistant, pytest), but
    # declared here so the test dependency is explicit — and so it survives
    # the removal of that shim, whose own dependency is otherwise its closest
    # guarantor. Lower-bound only: nothing here needs a specific patch.
    "packaging>=22.0",

    # Imported directly by the YAML-asset tests
    # (tests/test_notification_blueprint.py parses the bundled blueprint,
    # tests/test_dependabot_config.py parses .github/dependabot.yml).
    # Available transitively via homeassistant, but declared here so the test
    # dependency is explicit — the same reasoning as pillow and packaging
    # above. Lower-bound only: nothing here needs a specific patch.
    "PyYAML>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=custom_components/abode_security --cov-report=term-missing -m 'not integration'"
markers = [
    "integration: Integration tests requiring mock server (deselect with '-m \"not integration\"')",
    "unit: Fast unit tests with mocked responses",
]

[tool.setuptools.packages.find]
where = ["custom_components"]

[tool.ruff]
line-length = 88
# One minor behind `requires-python = ">=3.14.2"`. This started as a
# workaround for pyright not parsing PEP 758 (its formatter at py314 strips
# parens from multi-exception `except` clauses, which pyright then rejected).
# pyright 1.1.411 parses PEP 758, so that blocker is gone — but switching to
# py314 now reformats 20 files, so it wants its own commit rather than riding
# along with a dependency bump. py313 still gives us UP043
# (`Generator[T, None, None]` → `Generator[T]`) and the rest of the
# 3.12/3.13 pyupgrade lints we want. Keep `mypy.python_version` and
# `pyright.pythonVersion` tracking `requires-python` independently for stub
# selection.
target-version = "py313"
exclude = [
    "custom_components/abode_security/abode",  # Vendored library
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "PIE", "SIM", "ARG", "ASYNC", "DTZ"]
ignore = ["E501", "N812", "N818"]  # Naming conventions in vendored library

[tool.ruff.lint.per-file-ignores]
# Pytest fixtures appear in method signatures even when not used directly —
# they are evaluated as DI regardless of whether the test body references them.
"tests/**" = ["ARG002"]

[tool.mypy]
# Matches `requires-python = ">=3.14.2"`. Enables 3.12+/3.13+/3.14+ syntax
# checks (PEP 695 type aliases, `type` statements, etc.) and standard-library
# stubs that match the actual runtime.
python_version = "3.14"
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
follow_imports = "skip"
exclude = [
    "custom_components/abode_security/abode",  # Vendored library
]

[tool.pyright]
# Matches `requires-python = ">=3.14.2"` so pyright resolves against the
# 3.14 typeshed stubs rather than whatever interpreter it auto-detects.
# Note: pyright 1.1.411 does now parse PEP 758 (parenless multi-exception
# `except`). The ruff block above stays on py313 only to keep the resulting
# reformat out of this bump — see the comment there.
pythonVersion = "3.14"
exclude = [
    "custom_components/abode_security/abode",  # Vendored library
]
