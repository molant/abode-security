[project]
name = "abode-mock-server"
version = "0.1.0"
description = "Mock Abode API for integration and E2E tests"
# Matches the root project so the mock server and the test runner share a
# Python version (see the Dockerfile).
requires-python = ">=3.14.2"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    # Engine.IO v3 majors, to match the vendored Abode SocketIO client and
    # real Abode (#105). dependabot.yml ignores the v4 majors.
    "python-socketio==4.6.1",
    "python-engineio==3.14.2",
]

[tool.uv]
package = false
