blueprint:
  name: "Abode Security — Action notification"
  description: >
    Sends a mobile notification whenever an Abode action fires. When the triggering sensor's
    device exposes a co-located camera and the system is in home or away mode, the notification
    includes a snapshot image.

    Severity is decided by the integration, not here: an action that armed an alarm — or one
    whose alarm *failed* to arm — is announced as a critical alert, an away-mode trip is
    time-sensitive, and everything else is a normal notification. Set "Critical alerts" to
    always or never to override.
  domain: automation
  source_url: https://github.com/molant/abode-security/blob/main/blueprints/abode_security_notification.yaml
  input:
    notify_target:
      name: Notification target
      description: >
        The notify service to call, e.g. `notify.mobile_app_iphone` or
        `notify.mobile_app_pixel`. Do not include the `service:` keyword —
        just the dotted service name.
      selector:
        text:
          multiline: false

    action_filter:
      name: Action filter
      description: >
        Leave blank to notify for **all** triggered actions. Enter an `action_id` UUID
        (found in the automation trace or the event payload) to restrict notifications
        to that one action.
      default: ""
      selector:
        text:
          multiline: false

    critical_mode:
      name: Critical alerts
      description: >
        `auto` (recommended) escalates from the event's own `severity`: critical when an
        alarm was armed or failed to arm, time-sensitive in away mode, normal otherwise.
        `always` makes every notification critical. `never` disables escalation entirely.

        iOS: critical alerts bypass Do Not Disturb but require the Critical Alerts
        permission — grant it in the Home Assistant app under Settings → Notifications,
        or they are silently delivered as ordinary alerts.
        Android: the `critical` notification channel takes its importance from the value
        set the first time it is used. If you previously received a non-critical
        notification on that channel, clear the app's notification channels (app info →
        Notifications) so it is recreated at high importance.
      default: auto
      selector:
        select:
          options:
            - auto
            - always
            - never

trigger:
  - platform: event
    event_type: abode_security.action_triggered

variables:
  action_filter: !input action_filter
  critical_mode: !input critical_mode

condition:
  - condition: template
    value_template: >
      {{ (action_filter | trim) == "" or
         trigger.event.data.action_id == (action_filter | trim) }}

action:
  - variables:
      # `severity` and `alarm_outcome` are computed by the integration
      # (action_trigger._severity / _alarm_outcome) so that custom automations
      # get the same escalation as this blueprint. Older payloads predate both
      # keys, hence the defaults.
      severity: "{{ trigger.event.data.get('severity', 'normal') }}"
      alarm_outcome: "{{ trigger.event.data.get('alarm_outcome', 'none') }}"
      # Resolved to a *string* rather than a boolean on purpose. A template
      # variable that renders "False" is a non-empty string, and therefore
      # truthy in Jinja — a bug this blueprint has carried a warning about
      # since the original `choose` matrix. Comparing strings sidesteps it.
      push_mode: >-
        {% if critical_mode == 'always' or (critical_mode == 'auto' and severity == 'critical') %}
        critical
        {%- elif critical_mode == 'auto' and severity == 'high' %}
        time_sensitive
        {%- else %}
        none
        {%- endif %}

      title_text: >-
        {{ '⚠️ ALARM FAILED — ' if alarm_outcome in ['failed', 'partial'] else '' }}{{ trigger.event.data.action_name }}
      message_text: >-
        {{ trigger.event.data.sensor_friendly_name or trigger.event.data.triggered_by }}
        {{ 'opened' if trigger.event.data.sensor_device_class in ['door', 'window']
           else 'detected motion' if trigger.event.data.sensor_device_class == 'motion'
           else 'triggered' }}
        ({{ trigger.event.data.mode }}){%- if alarm_outcome == 'failed' %}

        No alarm was raised and monitoring was NOT contacted.
        {%- elif alarm_outcome == 'partial' %}

        Some alarms failed to arm — monitoring may not have been contacted.
        {%- elif alarm_outcome == 'armed' %}

        Alarm raised.
        {%- endif %}
        {%- if trigger.event.data.get('snapshot_error') %}

        (snapshot unavailable: {{ trigger.event.data.snapshot_error }})
        {%- endif %}

      # Built as merged dicts rather than a `choose` matrix over
      # (snapshot × camera × severity), which would need ~12 branches with the
      # push block repeated six times. A template that evaluates to a dict
      # yields a real dict, not the "True"/"False" strings that make bare
      # boolean-valued template *strings* unusable in conditions.
      link_data: >-
        {% set cam = trigger.event.data.camera_entity_id %}
        {% set url = '/abode_security?tab=cameras' ~ ('&camera=' ~ cam if cam else '') %}
        {{ {'url': url, 'clickAction': url} }}
      image_data: >-
        {{ {'image': trigger.event.data.snapshot_path}
           if trigger.event.data.snapshot_path else {} }}
      push_data: >-
        {% if push_mode | trim == 'critical' %}
        {{ {'push': {'interruption-level': 'critical',
                     'sound': {'name': 'default', 'critical': 1, 'volume': 1.0}},
            'channel': 'critical', 'priority': 'high', 'ttl': 0} }}
        {%- elif push_mode | trim == 'time_sensitive' %}
        {{ {'push': {'interruption-level': 'time-sensitive'},
            'channel': 'alerts', 'priority': 'high', 'ttl': 0} }}
        {%- else %}
        {{ {} }}
        {%- endif %}

  - service: !input notify_target
    data:
      title: "{{ title_text }}"
      message: "{{ message_text }}"
      # Merged with dict(pairs) rather than HA's `combine` filter, which only
      # exists on 2024.10+ — this blueprint has to work on the version floor
      # the integration declares in manifest.json.
      data: >-
        {{ dict(link_data.items() | list
                + image_data.items() | list
                + push_data.items() | list) }}
