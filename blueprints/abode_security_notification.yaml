blueprint:
  name: "Abode Security — Action notification"
  description: >
    Sends a mobile notification whenever an Abode action fires. When the triggering sensor's
    device exposes a co-located camera and the system is in home or away mode, the notification
    includes a snapshot image. Optionally filter to a single action by its ID, and optionally
    send as a critical alert (iOS: bypasses Do Not Disturb; Android: high-priority channel).
  domain: automation
  source_url: https://github.com/molant/abode-security/blob/main/blueprints/abode_security_notification.yaml
  input:
    notify_target:
      name: Notification target
      description: >
        The notify service to call, e.g. `notify.mobile_app_iphone` or
        `notify.mobile_app_pixel`. Do not include the `service:` keyword —
        just the dotted service name.
      selector:
        text:
          multiline: false

    action_filter:
      name: Action filter
      description: >
        Leave blank to notify for **all** triggered actions. Enter an `action_id` UUID
        (found in the automation trace or the event payload) to restrict notifications
        to that one action.
      default: ""
      selector:
        text:
          multiline: false

    critical:
      name: Critical alert
      description: >
        iOS: sends a critical alert that bypasses Do Not Disturb (requires the
        HA Companion app permission to be granted in iOS Settings).
        Android: sets a high-priority notification channel.
      default: false
      selector:
        boolean:

trigger:
  - platform: event
    event_type: abode_security.action_triggered

variables:
  action_filter: !input action_filter
  critical: !input critical

condition:
  - condition: template
    value_template: >
      {{ (action_filter | trim) == "" or
         trigger.event.data.action_id == (action_filter | trim) }}

action:
  - variables:
      title_text: "{{ trigger.event.data.action_name }}"
      message_text: >-
        {{ trigger.event.data.sensor_friendly_name or trigger.event.data.triggered_by }}
        {{ 'opened' if trigger.event.data.sensor_device_class in ['door', 'window']
           else 'detected motion' if trigger.event.data.sensor_device_class == 'motion'
           else 'triggered' }}
        ({{ trigger.event.data.mode }})
  # `trigger.event.data.snapshot_path is not none` is inlined in each branch
  # rather than stored as a `has_snapshot` variable, because a templated string
  # stored as a variable can render as the literal strings "True"/"False" —
  # both of which are truthy in Jinja and would mis-route the choose. The
  # inline form returns a real Python bool every time.
  #
  # Branch matrix: (snapshot, camera, critical). `snapshot` implies `camera`
  # (snapshot capture only runs when resolve_co_located_camera returns one),
  # so there's no "snapshot but no camera" cell. The deep-link is set on
  # `camera_entity_id is not none` independent of `snapshot_path` — if the
  # snapshot timed out (or we're in standby) but the camera is known, the
  # notification still lets the user tap through to the live stream.
  - choose:
      # snapshot + critical (camera implied)
      - conditions:
          - condition: template
            value_template: "{{ (trigger.event.data.snapshot_path is not none) and critical }}"
        sequence:
          - service: !input notify_target
            data:
              title: "{{ title_text }}"
              message: "{{ message_text }}"
              data:
                image: "{{ trigger.event.data.snapshot_path }}"
                # Tap → Abode Security panel's Cameras tab, scrolled/highlighted on
                # the triggering camera. The URL works the same on iOS Companion
                # (`url`) and Android Companion (`clickAction`); set both so the
                # blueprint is platform-agnostic.
                url: "/abode_security?tab=cameras&camera={{ trigger.event.data.camera_entity_id }}"
                clickAction: "/abode_security?tab=cameras&camera={{ trigger.event.data.camera_entity_id }}"
                push:
                  interruption-level: critical
                  sound:
                    name: default
                    critical: 1
                    volume: 1.0
                channel: critical
                priority: high
                ttl: 0
      # snapshot + non-critical (camera implied)
      - conditions:
          - condition: template
            value_template: "{{ (trigger.event.data.snapshot_path is not none) and not critical }}"
        sequence:
          - service: !input notify_target
            data:
              title: "{{ title_text }}"
              message: "{{ message_text }}"
              data:
                image: "{{ trigger.event.data.snapshot_path }}"
                url: "/abode_security?tab=cameras&camera={{ trigger.event.data.camera_entity_id }}"
                clickAction: "/abode_security?tab=cameras&camera={{ trigger.event.data.camera_entity_id }}"
      # no snapshot but camera known + critical
      - conditions:
          - condition: template
            value_template: >-
              {{ (trigger.event.data.snapshot_path is none)
                 and (trigger.event.data.camera_entity_id is not none)
                 and critical }}
        sequence:
          - service: !input notify_target
            data:
              title: "{{ title_text }}"
              message: "{{ message_text }}"
              data:
                url: "/abode_security?tab=cameras&camera={{ trigger.event.data.camera_entity_id }}"
                clickAction: "/abode_security?tab=cameras&camera={{ trigger.event.data.camera_entity_id }}"
                push:
                  interruption-level: critical
                  sound:
                    name: default
                    critical: 1
                    volume: 1.0
                channel: critical
                priority: high
                ttl: 0
      # no snapshot but camera known + non-critical
      - conditions:
          - condition: template
            value_template: >-
              {{ (trigger.event.data.snapshot_path is none)
                 and (trigger.event.data.camera_entity_id is not none)
                 and not critical }}
        sequence:
          - service: !input notify_target
            data:
              title: "{{ title_text }}"
              message: "{{ message_text }}"
              data:
                url: "/abode_security?tab=cameras&camera={{ trigger.event.data.camera_entity_id }}"
                clickAction: "/abode_security?tab=cameras&camera={{ trigger.event.data.camera_entity_id }}"
      # no camera + critical
      - conditions:
          - condition: template
            value_template: "{{ (trigger.event.data.camera_entity_id is none) and critical }}"
        sequence:
          - service: !input notify_target
            data:
              title: "{{ title_text }}"
              message: "{{ message_text }}"
              data:
                push:
                  interruption-level: critical
                  sound:
                    name: default
                    critical: 1
                    volume: 1.0
                channel: critical
                priority: high
                ttl: 0
    default:
      # no camera + non-critical
      - service: !input notify_target
        data:
          title: "{{ title_text }}"
          message: "{{ message_text }}"
